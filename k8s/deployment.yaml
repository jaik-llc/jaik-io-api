apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaik-io-api
  namespace: jaik-io-api
  labels:
    app: jaik-io-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jaik-io-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: jaik-io-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        # distroless "nonroot" is uid/gid 65532; the kubelet needs the number to enforce runAsNonRoot.
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: jaik-io-api:latest   # overridden by kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: ENV
              value: prod
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
